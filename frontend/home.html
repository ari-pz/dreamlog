<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dreamlog - Inicio</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/posts.css">

  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>



  <!----- Navbar ----->
  <div id="navbar"></div>
  <script src="js/navbar.js"></script>


  <!-- Barra de búsqueda: busca a partir de hashtags/etiquetas -->
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="Buscar sueños o #símbolos...">
  </div>

  <!-- MODAL  -->
  <div class="modal" id="modal-resultado">
    <div class="modal-background"></div>
    <div class="modal-card">
      <header class="modal-card-head">
        <p class="modal-card-title" id="modal-titulo"></p>
      </header>
      <section class="modal-card-body" id="modal-mensaje"></section>
      <footer class="modal-card-foot">
        <button class="button is-success" id="btn-aceptar">Aceptar</button>
        <button class="button is-success" id="btn-cancelar">Cancelar</button>
      </footer>
    </div>
  </div>

  <!-- SECCION  POSTS -->
  <div id="posts-container"></div>
  <script src="/js/home.js"></script>
  <script src="/js/renderPosts.js"></script>


</body>
</html>
