<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dreamlog - Inicio</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/posts.css">

  <link rel="icon" type="image/png" href="/img/favicon.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>



  <!----- Navbar ----->
  <div id="navbar"></div>
  <script src="js/navbar.js"></script>



  <!-- Barra de búsqueda: busca a partir de hashtags/etiquetas -->
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="Buscar sueños o #símbolos...">
  </div>



  <!-- SECCION  POSTS -->
  <div id="posts-container"></div>

  <script src="js/renderPosts.js"></script>

  <script>
    async function loadPosts() {
      try {
        const res = await fetch("/api/posts");
        const posts = await res.json();
        renderPosts(posts);
      } catch (err) {
        console.error("Error cargando posts:", err);
      }
    }
    loadPosts();
  </script>
  <script src="./js/home.js"></script>

</body>
</html>
