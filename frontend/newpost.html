<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dreamlog - Nuevo Sueño</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="css/newpost.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="navbar"></div>
  <script src="/js/navbar.js"></script>

  <h2 class="new-dream">Nuevo Sueño</h2>
  <form id="dream-form" class="newpost-container">
    <label for="content">Escribí tu sueño</label>
    <textarea id="content" placeholder="Escribe tu sueño aquí..." required class="input-estilo"></textarea>
    <div class="url">
      <label for="image">Inserta la URL de una Imagen/Gif</label>
      <p class="p-option">(Opcional)</P>
    </div>

    <input id="image" placeholder="https://example.com/mi-imagen.jpg" class="input-estilo">
    <label for="category">Elegí una de las categorías disponibles</label>
      <select id="category" required class="input-estilo">
        <option value="" disabled selected>Selecciona una categoria...</option>
        <option value="1">Pesadilla</option>
        <option value="2">Recurrente</option>
        <option value="3">Absurdo</option>
        <option value="4">Sensorial</option>
        <option value="5">Lúcido</option>
        <option value="6">Inquietante</option> 
      </select>
      <div class="buttons-container">
        <button id="btn-post" type="submit" class="submit-btn">Publicar Sueño</button>
        <button type="button" class="cancel-btn" onclick="window.location.href='/inicio'">Cancelar</button>
      </div>
  </form>


  <div class="modal" id="modal-resultado">
    <div class="modal-background"></div>
    <div class="modal-card">
      <header class="modal-card-head">
        <p class="modal-card-title" id="modal-titulo"></p>
      </header>
      <section class="modal-card-body" id="modal-mensaje"></section>
      <footer class="modal-card-foot">
        <button class="button is-success" id="btn-aceptar">Aceptar</button>
        <button class="button is-success" id="btn-cancelar">Cancelar</button>
      </footer>
    </div>
  </div>
  
  

  <script>
    function mostrarModal(titulo, mensaje) {
      document.getElementById("modal-titulo").innerText = titulo;
      document.getElementById("modal-mensaje").innerText = mensaje;
      document.getElementById("modal-resultado").classList.add("is-active");
    }
    function cerrarModal() {
      document.getElementById("modal-resultado").classList.remove("is-active");
    }
    document.getElementById("btn-aceptar").addEventListener("click", cerrarModal);
    document.getElementById("btn-cancelar").addEventListener("click", cerrarModal);
  </script>


  <script>
    document.getElementById("dream-form").addEventListener("submit", async (event) => {
      event.preventDefault();
    
      const content = document.getElementById("content").value;
      const image = document.getElementById("image").value;
      const category_id = document.getElementById("category").value;
      
      const loggedUser = JSON.parse(localStorage.getItem("loggedUser"));
  
      if (!loggedUser) {
        alert("Necesitas estar logueado");
        return;
      }
      
      if (!content) {
        alert("Tenés que escribir algo para publicar el sueño");
        return;
      }
      const user_id = loggedUser.user_id;
      
      const postData = {
        user_id: loggedUser.user_id,
        content,
        image,
        category_id
      };
      
      try {
        const response = await fetch(`${BACKEND_URL}/api/posts`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(postData),
        });

        const result = await response.json();

        if (!response.ok) {
          alert(result.error || "Error al crear la publicación");
          return;
        }

        alert("Publicación exitosa!");
        window.location.href = "/home.html";

      } catch (error) {
        console.error(error);
        alert("Error de conexión con el servidor");
      }
    });

  </script>

</body>
</html>
