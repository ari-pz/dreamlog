<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dreamlog - Nuevo Sueño</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="css/newpost.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="navbar"></div>
  <script src="/js/navbar.js"></script>


  <h2 class="new-dream">Nuevo Sueño</h2>
  <form id="dream-form" class="newpost-container">
    <label for="content">Escribí tu sueño</label>
    <textarea id="content" placeholder="Escribe tu sueño aquí..." required class="input-estilo"></textarea>
    <div class="url">
      <label>Inserta la URL de una Imagen/Gif</label>
      <p class="p-option">(Opcional)</p>
    </div>
    <input id="image" type="url" placeholder="https://example.com/mi-imagen.jpg" class="input-estilo">

    <label for="category">Elegí una de las categorías disponibles</label>
      <select id="category" required class="input-estilo">
        <option value="" disabled selected>Selecciona una categoría...</option>
        <option value="1">Pesadilla</option>
        <option value="2">Recurrente</option>
        <option value="3">Absurdo</option>
        <option value="4">Sensorial</option>
        <option value="5">Lúcido</option>
        <option value="6">Inquietante</option> 
      </select>
      <div class="buttons-container">
        <button type="submit" class="submit-btn">Publicar Sueño</button>
        <button type="button" class="cancel-btn" onclick="window.location.href='/inicio'">Cancelar</button>
      </div>
  </form>


  <script>
    document.getElementById("dream-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      
      const content = document.getElementById("content").value;
      const image = document.getElementById("image").value;
      const category_id = document.getElementById("category").value;
      
      const loggedUser = JSON.parse(localStorage.getItem("loggedUser"));

      if (!loggedUser) {
        alert("Necesitas estar logueado");
        return;
      }

      const postData = {
        user_id: loggedUser.user_id,
        content,
        image,
        category_id
      };

      try {
        const response = await fetch("http://localhost:3000/api/posts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(postData),
          });

          if (response.ok) {
            alert("¡Publicación exitosa!");
            window.location.href = "/inicio";
          } else {
            alert("Hubo un error al publicar el sueño.");
          } 
        } catch (error) {
          console.error("Error:", error);
          alert("No se pudo conectar con el servidor.");
        }
      });
    </script>
      
</body>
</html>
