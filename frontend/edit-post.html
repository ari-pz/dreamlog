<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dreamlog - Editar Sueño</title>
  <link rel="stylesheet" href="css/newpost.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

  <!----- Navbar ----->
  <div id="navbar"></div>
  <script src="/js/navbar.js"></script>



  <!-----Principal----->
  <h2 class="new-dream">Editar Sueño</h2>

  <div class="newpost-container">
    <label for="content">✦ Modifica tu sueño</label>
    <textarea id="content" placeholder="Escribe tu sueño aquí..." required class="input-estilo"></textarea>

    <label for="image">✦ Cambia la URL de la imagen</label>
    <input id="image" placeholder="https://example.com/mi-imagen.jpg" class="input-estilo">

    <label for="category">✦ Tu categoría se mantiene</label>
    <input id="category" class="input-estilo" disabled>

    <button id="btn-post" type="submit" class="atrapasueños-btn">Guardar Cambios</button>
  </div>

  <script>
    // 1. Obtener post_id de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('post_id');

    if (!postId) {
      alert('Error: No se encontró el ID del post en la URL.');
      console.error('No se pudo obtener el postId de la URL.');
      // Si no hay ID, no tiene sentido continuar
      // Podrías redirigir o simplemente detener la ejecución de loadPost
      // Pero si quieres que el botón no funcione:
      btnPost.disabled = true; // Deshabilita el botón si no hay ID
      throw new Error('Post ID es requerido.');
    }


    // 2. Seleccionar los inputs
    const contentInput = document.getElementById('content');
    const imageInput = document.getElementById('image');
    const categoryInput = document.getElementById('category');
    const btnPost = document.getElementById('btn-post');

    // 3. Función para traer el post desde el backend
    async function loadPost() {
      try {
        const res = await fetch(`/api/posts/${postId}`);
        if (res.status === 404) {
          alert('Post no encontrado');
          return;
        }
        const post = await res.json();

        // 4. Pre-cargar valores en el form
        contentInput.value = post.content || '';
        imageInput.value = post.image || '';
        categoryInput.value = post.category_name || '';

      } catch (error) {
        console.error('Error al cargar el post:', error);
      }
    }

    // 5. Llamar a la función al cargar la página
    loadPost();

    // 6. Función para enviar cambios (solo content e image)
    btnPost.addEventListener('click', async () => {
      const updatedPost = {
        content: contentInput.value,
        image: imageInput.value
      };

      try {
        const res = await fetch(`/api/posts/${postId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updatedPost)
        });

        if (res.ok) {
          alert('¡Sueño editado correctamente!');
          window.location.href = "/inicio";
        } else {
          const data = await res.json();
          alert('Error al editar: ' + data.error);
        }

      } catch (error) {
        console.error('Error al editar el post:', error);
      }
    });
  </script>

</body>
</html>
