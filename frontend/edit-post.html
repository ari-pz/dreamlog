<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dreamlog - Editar Sueño</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="css/newpost.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!----- Navbar ----->
  <div id="navbar"></div>
  <script src="/js/navbar.js"></script>



  <!-----Principal----->
  <h2 class="new-dream">Editar Sueño</h2>

  <div class="newpost-container">
    <label for="content">✦ Modifica tu sueño</label>
    <textarea 
      id="content" 
      placeholder="Escribe tu sueño aquí..." 
      required 
      class="input-estilo"
      maxlength="255"
    ></textarea>
    
    <small id="char-counter" class="char-hint">
      0 / 255 caracteres
    </small>

    <label for="image">✦ Cambia la URL de la imagen</label>
    <input id="image" placeholder="https://example.com/mi-imagen.jpg" class="input-estilo">

    <label for="category">✦ Tu categoría se mantiene</label>
    <input id="category" class="input-estilo" disabled>

    <div class="buttons-container">
      <button id="btn-post" class="submit-btn">
        Guardar cambios
      </button>
      <button 
        type="button" 
        class="cancel-btn"
        onclick="window.location.href='/home.html'"
      >
        Cancelar
      </button>
    </div>

  </div>

  <div class="modal" id="modal-resultado">
    <div class="modal-background"></div>
    <div class="modal-card">
      <header class="modal-card-head">
        <p class="modal-card-title" id="modal-titulo"></p>
      </header>
      <section class="modal-card-body" id="modal-mensaje"></section>
      <footer class="modal-card-foot">
        <button class="button is-success" id="btn-aceptar">Aceptar</button>
        <button class="button is-success" id="btn-cancelar">Cancelar</button>
      </footer>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('post_id');


    const contentInput = document.getElementById('content');
    const imageInput = document.getElementById('image');
    const categoryInput = document.getElementById('category');
    const btnPost = document.getElementById('btn-post');
    
    const counter = document.getElementById("char-counter");
    const MAX_CHARS = 255;
    
    if (!postId) {
      alert('Error: No se encontró el ID del post en la URL.');
      console.error('No se pudo obtener el postId de la URL.');

      btnPost.disabled = true; // Deshabilita el botón si no hay ID
      throw new Error('Post ID es requerido.');
    }
    
    function updateCounter() {
      const length = contentInput.value.length;
      counter.textContent = `${length} / ${MAX_CHARS} caracteres`;

      if (length >= MAX_CHARS) {
        counter.classList.add("limit");
      } else {
        counter.classList.remove("limit");
      }
    }
    
    contentInput.addEventListener("input", updateCounter);

    async function loadPost() {
      try {
        const res = await fetch(`${BACKEND_URL}/api/posts/${postId}`);
        if (res.status === 404) {
          alert('Post no encontrado');
          return;
        }
        const post = await res.json();

        contentInput.value = post.content || '';
        imageInput.value = post.image || '';
        categoryInput.value = post.category_name || '';
        
        updateCounter();

      } catch (error) {
        console.error('Error al cargar el post:', error);
      }
    }

    loadPost();

    btnPost.addEventListener('click', async () => {
      const updatedPost = {
        content: contentInput.value,
        image: imageInput.value
      };

      try {
        const res = await fetch(`${BACKEND_URL}/api/posts/${postId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updatedPost)
        });

        if (res.ok) {
          alert('¡Sueño editado correctamente!');
          window.location.href = "/home.html";
        } else {
          const data = await res.json();
          alert('Error al editar: ' + data.error);
        }

      } catch (error) {
        console.error('Error al editar el post:', error);
      }
    });
  </script>

</body>
</html>
