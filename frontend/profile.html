<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DreamLog</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/posts.css">
</head>
<body>

  <!----- Navbar ----->
  <div id="navbar"></div>
  <script src="js/navbar.js"></script>

  <!-- ===== CONTENEDOR DE DOS COLUMNAS ===== -->
  <div class="perfil-contenedor">

    <!-- ====================== COLUMNA IZQUIERDA ====================== -->
    <div class="col-izquierda">

      <!-- Perfil del usuario -->
      <div class="usuario-card">
        <article class="media">
          <figure class="image is-128x128" id="img-usuario">
            <img id="profile-pic" class="is-rounded" src="https://bulma.io/assets/images/placeholders/128x128.png" />
          </figure>

          <div class="media-content">
            <p id="profile-username">
              <strong>username</strong>
            </p>
            
            <p id="profile-bio"></p>

            <div class="buttons"> 
              <a class="button is-primary" id="boton-editar" href="profile-editar.html">Editar</a>
              <a class="button is-danger" id="boton-eliminar">Eliminar</a>
            </div>
          </div>

        </article>
      </div>

      <!-- Título de los posts -->
      <h3 class="titulo-posts">Mis sueños tejidos</h3>

      <!-- Contenedor donde se cargan los posts -->
      <div id="my-posts"></div>

    </div>


    <!-- ====================== COLUMNA DERECHA (Mascota) ====================== -->
    <div class="col-derecha">

      <div class="mascota-card">
        <img id="imagen-mascota" src="" style="width:100%; border-radius:20px; transition: opacity .6s; cursor:pointer;">
        <p id="frase-mascota" style="margin-top:1rem; opacity:1; transition: opacity .4s; color:#c4a9ff;"></p>
        <p class="texto-mascota">Tocá tu guía nocturno para recibir un mensaje ✨</p>
      </div>

    </div>

  </div>
  <!-- ===== FIN DEL CONTENEDOR DE DOS COLUMNAS ===== -->



  <!-- ======================= MODAL ======================= -->
  <div class="modal" id="modal-resultado">
    <div class="modal-background"></div>
    <div class="modal-card">
      <header class="modal-card-head">
        <p class="modal-card-title" id="modal-titulo"></p>
      </header>
      <section class="modal-card-body" id="modal-mensaje"></section>
      <footer class="modal-card-foot">
        <button class="button is-success" id="btn-aceptar">Aceptar</button>
        <button class="button is-success" id="btn-cancelar">Cancelar</button>
      </footer>
    </div>
  </div>



  <!-- ======================= OBTENER DATOS DEL USUARIO ======================= -->
  <script>
  document.addEventListener("DOMContentLoaded", async () => {
    const loggedUser = JSON.parse(localStorage.getItem("loggedUser"));
    if (!loggedUser) {
      window.location.href = "/login.html";
      return;
    }

    try {
      const res = await fetch(`/api/users/${loggedUser.user_id}`);
      if (!res.ok) throw new Error("No se pudo obtener el perfil");
      const user = await res.json();

      document.getElementById("profile-username").textContent = `@${user.username}`;
      document.getElementById("profile-bio").textContent = user.bio || "Sin bio";
      document.getElementById("profile-pic").src = user.pfp || "/imagenes/icon_default.png";
    } catch (err) {
      console.error(err);
    }
  });
  </script> 
  <script src="js/profile.js"></script>




  <!-- POSTS DEL USUARIO LOGUEADO -->

  <div id="posts-container"></div>

  <script src="js/renderPosts.js"></script>
  <script>
    const loggedUser = JSON.parse(localStorage.getItem("loggedUser"));

    if (!loggedUser) {
      window.location.href = "/";
    }

    // Traer posts del usuario
    fetch(`/api/posts/${loggedUser.user_id}`)
      .then(res => res.json())
      .then(posts => {
        console.log("posts del usuario:", posts);
        renderPosts(posts);
      });
  </script>

      "imagenes-mascotas/panda4.png"

</body>
</html>
