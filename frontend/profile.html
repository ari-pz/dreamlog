<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DreamLog</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">

   <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/posts.css">
</head>
<body>



  <!----- Navbar ----->
  <div id="navbar"></div>
  <script src="/js/navbar.js"></script>

 

  <!-- Datos del Usuario -->
  <div class="perfil"> 
      <article class="media">
        <figure class="image is-128x128" id="img-usuario">
          <img id="profile-pic" class="is-rounded" src="https://bulma.io/assets/images/placeholders/128x128.png" />
        </figure>
        <div class="media-content">
          <div class="content">
            <p id="profile-username">
              <strong>username</strong>
            </p>
            
            <p id="profile-bio"></p>
            <div class="buttons"> 
              <a class="button is-primary" id="boton-editar" href="profile-editar.html">Editar</a>
              <a class="button is-danger" id="boton-eliminar">Eliminar</a>
            </div>
          </div>
          </div>
      </article>
    </div>

   <!--Pop Up -->
    <div class="modal" id="modal-resultado">
      <div class="modal-background"></div>
      <div class="modal-card">
        <header class="modal-card-head">
          <p class="modal-card-title" id="modal-titulo"></p>
        </header>
        <section class="modal-card-body" id="modal-mensaje"></section>
        <footer class="modal-card-foot">
          <button class="button is-success" id="btn-aceptar">Aceptar</button>
          <button class="button is-success" id="btn-cancelar">Cancelar</button>

        </footer>
      </div>
    </div>

  <!-- Obtener datos del usuario por user_id-->
  <script>
  document.addEventListener("DOMContentLoaded", async () => {
    const loggedUser = JSON.parse(localStorage.getItem("loggedUser"));
    if (!loggedUser) {
      window.location.href = "/login.html";
      return;
    }

    try {
      const res = await fetch(`/api/users/${loggedUser.user_id}`);
      if (!res.ok) throw new Error("No se pudo obtener el perfil");
      const user = await res.json();

      document.getElementById("profile-username").textContent = `@${user.username}`;
      document.getElementById("profile-bio").textContent = user.bio || "Sin bio";
      document.getElementById("profile-pic").src = user.pfp || "/imagenes/icon_default.png";
    } catch (err) {
      console.error(err);
    }
  });
  </script>
 
 
  <!-- Posts del usuario --> 
  <div id="my-posts"></div>

  <script src="./js/profile.js"></script>

  <!-- 🟦 Mascota -->
  <script>
    const imagenesPanda = [
      "./imagenes-mascotas/panda1.png",
      "./imagenes-mascotas/panda2.png",
      "./imagenes-mascotas/panda3.png",
      "./imagenes-mascotas/panda4.png"
    ];

    let indice = 0;
    const imgMascota = document.getElementById("imagen-mascota");

    setInterval(() => {
      imgMascota.style.opacity = 0;
      setTimeout(() => {
        indice = (indice + 1) % imagenesPanda.length;
        imgMascota.src = imagenesPanda[indice];
        imgMascota.style.opacity = 1;
      }, 600);
    }, 7000);

    const frasesPanda = [
      "Hoy es un buen día para soñar fuerte 🌙",
      "Estoy orgulloso de vos, pequeño soñador.",
      "Respirá... todo va a estar bien 🐼✨",
      "Tu sueño tiene más poder del que imaginás.",
      "Recordá: un paso a la vez.",
      "Estoy acá con vos, siempre.",
      "El descanso también es parte del camino.",
      "Vos podés más de lo que creés.",
      "Gracias por visitarme, te extrañaba ♡",
      "Tu mundo interior es increíble."
    ];

    const fraseCaja = document.getElementById("frase-mascota");

    imgMascota.addEventListener("click", () => {
      const indiceFrase = Math.floor(Math.random() * frasesPanda.length);

      fraseCaja.style.opacity = 0;

      setTimeout(() => {
        fraseCaja.textContent = frasesPanda[indiceFrase];
        fraseCaja.style.opacity = 1;
      }, 400);
    });
  </script>


  
</body>
</html>
