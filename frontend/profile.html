<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DreamLog</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=MedievalSharp&family=Sixtyfour&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="profile.css"> 
</head>
<body>
  <div class="navbar-profile" id="navbar-perfil"> 
    <nav class="navbar" role="navigation" aria-label="main navigation">
        <div class="navbar-menu">
            <div class="navbar-start">
                <a class="navbar-item">
                    Blogs
                </a>
            </div>

        <div class="navbar-center">
            <a class="navbar-item" href="index.html">
            <img src="./imagenes/logo.svg" alt="DreamLog" id="logo">
            </a>
        </div>
    
        <div class="navbar-end">
            <div class="navbar-item">
                <div class="buttons">
                    <a class="button iniciar-sesion">
                        <strong>Nuevo Post</strong>
                    </a>
                    <a class="button is-light">
                        Perfil
                    </a>
                </div>
            </div>
        </div>
    </nav>
  </div>

  <div class="perfil"> 
      <article class="media">
        <figure class="image is-128x128" id="img-usuario">
          <img class="is-rounded" src="https://bulma.io/assets/images/placeholders/128x128.png" />
        </figure>
        <div class="media-content">
          <div class="content">
            <p id="nombre-usuario">
              <strong>Nombre Usuario</strong>
              <br />
              <br />
              <h5> Descripcion </h5>
              Blah blahb blah. 
            </p>
            <div class="buttons"> 
              <button class="button is-primary" id="boton-editar">Editar</button>
              <button class="button is-danger" id="boton-eliminar">Eliminar</button>
            </div>
          </div>
          </div>
      </article>
    </div>


</body>
</html>
