<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dreamlog - Editar Sueño</title>
  <link rel="stylesheet" href="css/newpost.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

  <!----- Navbar ----->
  <div id="navbar"></div>
  <script src="/js/navbar.js"></script>

  <!-----Principal----->
  <h2 class="new-dream">Editar Comentario</h2>

  <div class="newpost-container">
    <label for="content">✦ Modifica tu comentario</label>
    <textarea id="content" placeholder="Escribe tu comentario aquí..." required class="input-estilo"></textarea>

    <label for="url">✦ Cambia la URL de multimedia</label>
    <input id="url" placeholder="https://example.com/mi-multimedia.jpg" class="input-estilo">

    <button id="btn-comment" type="submit" class="atrapasueños-btn">Guardar Cambios</button>
  </div>


  <script>
  document.addEventListener("DOMContentLoaded", () => {
    // 1. Obtener datos de la memoria (LocalStorage)
    // Esto lo guardamos desde home.js o profile.js antes de venir aquí
    const commentId = localStorage.getItem("edit_comment_id");
    const oldContent = localStorage.getItem("edit_comment_content");
    // Nota: Como no guardamos la URL en home.js, el campo URL aparecerá vacío al principio. 
    // Si quieres editar la URL, tendrías que guardarla también en home.js.

    // Seleccionar inputs
    const contentInput = document.getElementById('content');
    const urlInput = document.getElementById('url');
    const btnComment = document.getElementById('btn-comment');

    // 2. Validación de seguridad
    if (!commentId) {
      alert("No se seleccionó ningún comentario.");
      window.location.href = "/inicio"; // Volver al home si entraron directo
      return;
    }

    // 3. Pre-cargar el texto en el formulario
    contentInput.value = oldContent || '';

    // 4. Función para GUARDAR cambios (PUT)
    btnComment.addEventListener('click', async (e) => {
      e.preventDefault(); // Evitar que el botón recargue la página

      const updatedContent = contentInput.value.trim();
      const updatedUrl = urlInput.value.trim(); // Opcional

      if (!updatedContent) {
        alert("El comentario no puede estar vacío");
        return;
      }

      const updatedComment = {
        content: updatedContent,
        url: updatedUrl
      };

      try {
        const res = await fetch(`/api/comments/${commentId}`, {
          method: 'PUT', // Asegúrate de que en index.js sea app.put
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updatedComment)
        });

        if (res.ok) {
          // Limpiamos la memoria
          localStorage.removeItem("edit_comment_id");
          localStorage.removeItem("edit_comment_content");
          
          alert('¡Comentario editado correctamente!');
          window.location.href = "/inicio"; // Volver al home
        } else {
          const data = await res.json();
          alert('Error al editar: ' + (data.error || "Error desconocido"));
        }

      } catch (error) {
        console.error('Error al editar el comentario:', error);
        alert("Error de conexión con el servidor");
      }
    });

    // Cancelar (Opcional, si quisieras agregar un botón de volver)
    // ...
  });
</script>
