<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dreamlog - Mi Atrapasueños</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/atrapasuenios.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!----- Navbar ----->
  <div id="navbar"></div>
  <script src="/js/navbar.js"></script>
  
  <!-----Principal----->

  <main class="atrapasueños-principal">
    <section class="atrapasueños-secundario">

       <div class="titulo-con-info">
          <h2>Tu Atrapasueños</h2>
          <div class="info-tooltip-container">
            
              <span class="info-icon">
                <i class="fa-solid fa-feather-pointed"></i>
              </span>
        
              <div class="info-card">
                  <p><strong>Desbloquea el brillo:</strong></p>
                  <p>5 posts ➔ 3 plumas</p>
                  <p>20 posts ➔ 6 plumas</p>
                  <p>50 posts ➔ 9 plumas</p>
                  <p>100 posts ➔ 12 plumas</p>
              </div>
          </div>
      </div>
      
      <div class="atrapasueños">
          <div class="anillo">
              <img src="img/atrapasueño.png" alt="Atrapasueños" class="atrapasueños-image">
          </div>
          <div class="plumas">
          <div class="pluma"></div>
          <div class="pluma "></div>
          <div class="pluma "></div>
          <div class="pluma"></div>
          <div class="pluma"></div>
          <div class="pluma "></div>
          <div class="pluma"></div>
          <div class="pluma "></div>
          <div class="pluma"></div>
          <div class="pluma "></div>
          <div class="pluma"></div>
          <div class="pluma "></div>
        </div>
      </div>
      <br>
      <br>
      <br>
      <br>
      <br>
      <br>
      <br>
      <div class="dream-stats"></div>

      <div class="top-categories">
        <div id="category-boxes" class="category-boxes">
          <div class="cat-box empty"></div>
          <div class="cat-box empty"></div>
          <div class="cat-box empty"></div>
        </div>
      </div>

      <div class="dream-quote">
        <p id="quote">“Cada hilo guarda un recuerdo invisible”</p>
      </div>
    </section>
  </main>

  <div class="modal" id="modal-resultado">
    <div class="modal-background"></div>
    <div class="modal-card">
      <header class="modal-card-head">
        <p class="modal-card-title" id="modal-titulo"></p>
      </header>
      <section class="modal-card-body" id="modal-mensaje"></section>
      <footer class="modal-card-foot">
        <button class="button is-success" id="btn-aceptar">Aceptar</button>
        <button class="button is-success" id="btn-cancelar">Cancelar</button>
      </footer>
    </div>
  </div>

  <script src="./js/atrapasuenio.js"></script>
</body>
</html>
