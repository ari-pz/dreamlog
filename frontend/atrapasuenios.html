<!DOCTYPE html>

</head>
<body>

  <!----- Navbar ----->
  <div id="navbar"></div>
  <script src="/js/navbar.js"></script>
  
  <!-----Principal----->

  <main class="atrapasueños-principal">
    <section class="atrapasueños-secundario">
      <h2>Tu Atrapasueños</h2>
      <div class="atrapasueños">
          <div class="anillo">
              <img src="img/atrapasueño.png" alt="Atrapasueños" class="atrapasueños-image">
          </div>
          <div class="plumas">
          <div class="pluma"></div>

          <div class="pluma "></div>

          <div class="pluma "></div>
          <div class="pluma"></div>
          <div class="pluma "></div>
        </div>
      </div>
      <br>
      <br>
      <br>
      <br>
      <br>
      <br>
      <div class="dream-stats">
        <p>✦ 12 sueños tejidos</p>
        <p>✦ 3 visiones lunares</p>
        <p>✦ 2 pesadillas disipadas</p>
      </div>

      <div class="dream-fragments">
        <h3>Fragmentos atrapados</h3>
        <div class="fragment-grid">
          <div class="fragment">La casa infinita</div>
          <div class="fragment">Volar sobre el mar</div>
          <div class="fragment">El pasillo azul</div>
          <div class="fragment">Sombras conocidas</div>
        </div>
      </div>

      <div class="dream-quote">
        <p id="quote">“Cada hilo guarda un recuerdo invisible.”</p>
      </div>
    </section>
  </main>

  <script src="./js/atrapasuenio.js"></script>
