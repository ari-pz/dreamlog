<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

<body>

  <!----- Navbar ----->

      <h2>Tu Atrapasueños</h2>

          <div class="pluma"></div>
          <div class="pluma "></div>
          <div class="pluma"></div>
          <div class="pluma "></div>
        </div>
      </div>
      <br>
      <br>
      <br>
      <br>
      <br>
      <br>
      <div class="dream-stats">
        <!-- stats dinámicos se cargarán aquí -->
      </div>


      <div class="top-categories">
        <h3>Tus hilos más recurrentes</h3>
      <div id="category-boxes" class="category-boxes">

        <div class="cat-box empty" data-category-id="1">
          <div class="cat-name"></div>
          <div class="cat-count"></div>
        </div>

        <div class="cat-box empty" data-category-id="2">
          <div class="cat-name"></div>
          <div class="cat-count"></div>
        </div>

        <div class="cat-box empty" data-category-id="3">

        </div>

        <div class="cat-box empty" data-category-id="5">
          <div class="cat-name"></div>
          <div class="cat-count"></div>
        </div>

        <div class="cat-box empty" data-category-id="6">
          <div class="cat-name"></div>
          <div class="cat-count"></div>
        </div>
      </div>



      <div class="dream-quote">
        <p id="quote">“Cada hilo guarda un recuerdo invisible.”</p>
      </div>
    </section>
  </main>

  <script src="./js/atrapasuenio.js"></script>
</body>
</html>
