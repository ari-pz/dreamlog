<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dreamlog - Iniciar sesion</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="css/login-register.css">

</head>
<body>
  <div class="logo-index">
    <h2>Dreamlog</h2>
  </div>
  
  <div class="form-container">
    <form id="loginForm">
      <div class="form-input">
        <input type="text" id="username" placeholder="Usuario">
        <input type="password" id="password" placeholder="Contraseña">
      </div>
      <button type="submit">Entrar</button>
      <div class="login-register-link">
        <p>¿No tienes una cuenta?</p>
	      <a href="register.html">Registrate aquí</a>
      </div>
    </form>
  </div>

  <div class="modal" id="modal-resultado">
    <div class="modal-background"></div>
    <div class="modal-card">
      <header class="modal-card-head">
        <p class="modal-card-title" id="modal-titulo"></p>
      </header>
      <section class="modal-card-body" id="modal-mensaje"></section>
      <footer class="modal-card-foot">
        <button class="button is-success" id="btn-aceptar">Aceptar</button>
      </footer>
    </div>
  </div>


  <script>
  const modal = document.getElementById('modal-resultado');
  const modalTitulo = document.getElementById('modal-titulo');
  const modalMensaje = document.getElementById('modal-mensaje');
  const btnAceptar = document.getElementById('btn-aceptar');

  function mostrarModal(titulo, mensaje) {
    modalTitulo.textContent = titulo;
    modalMensaje.textContent = mensaje;
    modal.classList.add('is-active');
  }

  function cerrarModal() {
    modal.classList.remove('is-active');
  }

  btnAceptar.addEventListener('click', cerrarModal);

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      if (!username || !password) {
        mostrarModal("Faltan datos", "Por favor completa todos los campos");
        return;
      }

      const res = await fetch("/api/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ username, password })
      });


      if (res.status === 200) {
        const data = await res.json();
    
        localStorage.setItem("loggedUser", JSON.stringify({
          user_id: data.user.user_id,
          username: data.user.username
        }));

        window.location.href = "/inicio";
      
      } else {
        mostrarModal("Error de acceso", "Usuario o contraseña incorrectos");
      }
    });
  </script>
 

</body>
</html>
